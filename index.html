
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuessMoji | Emoji Guessing Game</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #172554);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px #0005;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: bold;
    }

    .category {
      flex: 1;
      background: #334155;
      color: white;
    }

    .category.active {
      background: #38bdf8;
      color: #082f49;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .puzzle {
      background: #0f172a;
      border-radius: 16px;
      padding: 30px 12px;
      margin-bottom: 20px;
    }

    .emojis {
      font-size: 62px;
      margin: 15px 0;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      color: white;
      background: #334155;
      border: 1px solid #64748b;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    input::placeholder { color: #cbd5e1; }

    .submit {
      width: 100%;
      background: #38bdf8;
      color: #082f49;
    }

    .next {
      width: 100%;
      background: #475569;
      color: white;
      margin-top: 10px;
    }

    .hint-btn {
      background: transparent;
      color: #facc15;
      margin-top: 10px;
    }

    .feedback {
      min-height: 28px;
      margin-top: 15px;
      font-weight: bold;
    }

    .hint {
      color: #facc15;
      min-height: 20px;
    }

    button:hover { filter: brightness(1.12); }
    button:disabled { opacity: .55; cursor: default; }
  </style>
</head>

<body>
  <main class="game">
    <h1>🎮 GuessMoji</h1>
    <p class="subtitle">Guess the movie or country from emojis!</p>

    <div class="categories">
      <button class="category active" id="moviesBtn">🎬 Movies</button>
      <button class="category" id="countriesBtn">🌍 Countries</button>
    </div>

    <div class="stats">
      <span id="progress">Puzzle 1 of 5</span>
      <span id="score">Score: 0</span>
    </div>

    <section class="puzzle">
      <p id="question">Guess the movie</p>
      <div class="emojis" id="emoji" aria-label="Emoji clue"></div>
    </section>

    <form id="answerForm">
      <input
        id="answer"
        type="text"
        placeholder="Type your answer..."
        autocomplete="off"
        aria-label="Your guess"
      >
      <button class="submit" id="submitBtn" type="submit">
        Submit Answer
      </button>
    </form>

    <button class="hint-btn" id="hintBtn">💡 Show Hint</button>
    <p class="hint" id="hint"></p>

    <p class="feedback" id="feedback" role="status"></p>

    <button class="next" id="nextBtn">Skip / Next Puzzle →</button>
  </main>

  <script>
    const puzzles = {
      movies: [
        {
          emoji: "🦁👑",
          answers: ["The Lion King", "Lion King"],
          hint: "A Disney movie about a young lion."
        },
        {
          emoji: "❄️👸",
          answers: ["Frozen"],
          hint: "Two sisters and magical ice powers."
        },
        {
          emoji: "🐠🔍",
          answers: ["Finding Nemo"],
          hint: "A father searches for his missing fish."
        },
        {
          emoji: "🧸🚀",
          answers: ["Toy Story"],
          hint: "Toys come to life when people leave."
        },
        {
          emoji: "🕷️🦸",
          answers: ["Spider-Man", "Spiderman", "Spider Man"],
          hint: "A superhero who shoots webs."
        }
      ],

      countries: [
        {
          emoji: "🗼🥖",
          answers: ["France"],
          hint: "Home of the Eiffel Tower."
        },
        {
          emoji: "🍣🗻",
          answers: ["Japan"],
          hint: "Known for sushi and Mount Fuji."
        },
        {
          emoji: "🍕🍝",
          answers: ["Italy"],
          hint: "Famous for pizza and pasta."
        },
        {
          emoji: "🗽🍔",
          answers: [
            "United States",
            "USA",
            "US",
            "United States of America",
            "America"
          ],
          hint: "Home of the Statue of Liberty."
        },
        {
          emoji: "🐪🔺",
          answers: ["Egypt"],
          hint: "Famous for ancient pyramids."
        }
      ]
    };

    let category = "movies";
    let puzzleIndex = 0;
    let score = 0;
    let solved = false;
    let finished = false;

    const emojiEl = document.getElementById("emoji");
    const questionEl = document.getElementById("question");
    const answerEl = document.getElementById("answer");
    const feedbackEl = document.getElementById("feedback");
    const hintEl = document.getElementById("hint");
    const progressEl = document.getElementById("progress");
    const scoreEl = document.getElementById("score");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const hintBtn = document.getElementById("hintBtn");
    const moviesBtn = document.getElementById("moviesBtn");
    const countriesBtn = document.getElementById("countriesBtn");

    function normalize(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9 ]/g, "")
        .replace(/\s+/g, " ");
    }

    function showPuzzle() {
      const puzzle = puzzles[category][puzzleIndex];

      finished = false;
      solved = false;

      emojiEl.textContent = puzzle.emoji;
      questionEl.textContent =
        category === "movies" ? "Guess the movie" : "Guess the country";

      answerEl.value = "";
      answerEl.disabled = false;
      submitBtn.disabled = false;
      feedbackEl.textContent = "";
      hintEl.textContent = "";
      hintBtn.hidden = false;
      nextBtn.textContent = "Skip / Next Puzzle →";

      progressEl.textContent =
        `Puzzle ${puzzleIndex + 1} of ${puzzles[category].length}`;

      scoreEl.textContent = `Score: ${score}`;
      answerEl.focus();
    }

    function checkAnswer(event) {
      event.preventDefault();

      if (finished || solved) return;

      const guess = normalize(answerEl.value);

      if (!guess) {
        feedbackEl.textContent = "Please enter an answer.";
        feedbackEl.style.color = "#facc15";
        return;
      }

      const puzzle = puzzles[category][puzzleIndex];

      const correct = puzzle.answers.some(
        answer => normalize(answer) === guess
      );

      if (correct) {
        score += 10;
        solved = true;

        feedbackEl.textContent = "✅ Correct! +10 points!";
        feedbackEl.style.color = "#4ade80";

        answerEl.disabled = true;
        submitBtn.disabled = true;
        nextBtn.textContent = "Next Puzzle →";

        scoreEl.textContent = `Score: ${score}`;
      } else {
        feedbackEl.textContent = "❌ Not quite. Try again!";
        feedbackEl.style.color = "#fb7185";
      }
    }

    function nextPuzzle() {
      if (finished) {
        puzzleIndex = 0;
        score = 0;
        showPuzzle();
        return;
      }

      puzzleIndex++;

      if (puzzleIndex >= puzzles[category].length) {
        showResults();
      } else {
        showPuzzle();
      }
    }

    function showResults() {
      finished = true;

      emojiEl.textContent = "🏆🎉";
      questionEl.textContent = "Round Complete!";
      progressEl.textContent = "Finished";

      feedbackEl.textContent =
        `Final score: ${score} out of ${puzzles[category].length * 10}`;

      feedbackEl.style.color = "#4ade80";
      hintEl.textContent = "";

      answerEl.disabled = true;
      submitBtn.disabled = true;
      hintBtn.hidden = true;
      nextBtn.textContent = "Play Again";
    }

    function changeCategory(newCategory) {
      category = newCategory;
      puzzleIndex = 0;
      score = 0;

      moviesBtn.classList.toggle("active", category === "movies");
      countriesBtn.classList.toggle("active", category === "countries");

      showPuzzle();
    }

    document.getElementById("answerForm")
      .addEventListener("submit", checkAnswer);

    nextBtn.addEventListener("click", nextPuzzle);

    hintBtn.addEventListener("click", () => {
      if (!finished) {
        hintEl.textContent =
          "💡 " + puzzles[category][puzzleIndex].hint;
      }
    });

    moviesBtn.addEventListener("click", () => {
      changeCategory("movies");
    });

    countriesBtn.addEventListener("click", () => {
      changeCategory("countries");
    });

    showPuzzle();
  </script>
</body>
</html>
